openapi: 3.0.3

info:
  title: Patient management API-REST
  version: 1.0.0
  description: API-REST developed with Node.js and Express

paths:
  /pacientes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Obtener paciente por id
      description: Devuelve un array con la informacion del paciente al que pertenece el id

      responses:
        "200":
          description: Paciente obtenido correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Paciente"

        "401":
          $ref: "#/components/responses/UnauthorizedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Update an existent patient
      description: Update an existent patient data into the database by his id

      responses:
        "200":
          description: Paciente actualizado correctamente

        "404":
          $ref: "#/components/responses/NotFoundError"
          example:
            error: "Paciente no encontrado"

        "400":
          $ref: "#/components/responses/ValidationError"

        "401":
          $ref: "#/components/responses/UnauthorizedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Delete a patient
      description: Delete a patient from the database by his id

      responses:
        "204":
          description: Paciente eliminado correctamente

        "404":
          $ref: "#/components/responses/NotFoundError"
          example:
            error: "Paciente no encontrado"

        "401":
          $ref: "#/components/responses/UnauthorizedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /pacientes:
    get:
      summary: Obtener todos los pacientes
      description: Devuelve un array con la informacion de todos los pacientes guardados en la base de datos

      responses:
        "200":
          description: Array of patients retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Paciente"

        "401":
          $ref: "#/components/responses/UnauthorizedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Create a new patient
      description: Insert a new patient into the patients table in the database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PacienteInput"

      responses:
        "201":
          description: Paciente insertado correctamente

        "400":
          $ref: "#/components/responses/ValidationError"

        "401":
          $ref: "#/components/responses/UnauthorizedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /citas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Obtener cita por id
      description: Devuelve un array con la informacion de la cita a la que pertenece el id

      responses:
        "200":
          description: Cita obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cita"

        "401":
          $ref: "#/components/responses/UnauthorizedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Actualizar cita
      description: Actualizar una cita existente en la base de datos por su id

      responses:
        "200":
          description: Cita actualizada correctamente
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/CitaInput"

        "404":
          $ref: "#/components/responses/NotFoundError"
          example:
            error: Cita no encontrada

        "400":
          $ref: "#/components/responses/ValidationError"

        "401":
          $ref: "#/components/responses/UnauthorizedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Eliminar cita
      description: Eliminar una cita existente en la base de datos por su id

      responses:
        "204":
          description: Cita eliminada correctamente

        "404":
          $ref: "#/components/responses/NotFoundError"
          example:
            error: Cita no encontrada

        "401":
          $ref: "#/components/responses/UnauthorizedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /citas:
    get:
      summary: Obtener todas las citas
      description: Devuelve un array con la informacion de todas las citas guardadas en la base de datos

      responses:
        "200":
          description: Lista de citas obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cita"

        "401":
          $ref: "#/components/responses/UnauthorizedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Insertar cita
      description: Insertar una nueva cita en la base de Datos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitaInput"

      responses:
        "201":
          description: Cita insertada correctamente

        "400":
          $ref: "#/components/responses/ValidationError"

        "401":
          $ref: "#/components/responses/UnauthorizedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /usuarios/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Obtener usuario por id
      description: Obtiene un array con la informacion de todos los usuarios guardados en la base de datos

      responses:
        "200":
          description: Usuario obtenido correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Usuario"

        "401":
          $ref: "#/components/responses/UnauthorizedError"

        "403":
          $ref: "#/components/responses/ForbbidenError"

        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Actualiza un usuario existente
      description: Actualiza los datos de un usurio ya existente en la base de datos por su id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioInput"

      responses:
        "200":
          description: Usuario actualizado correctamente

        "404":
          $ref: "#/components/responses/NotFoundError"
          example:
            error: Usuario no encontrado

        "400":
          $ref: "#/components/responses/ValidationError"

        "401":
          $ref: "#/components/responses/UnauthorizedError"

        "403":
          $ref: "#/components/responses/ForbbidenError"

        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Elimina un usuario existente
      description: Elimina a un usuario existente en la base de datos mediante su id

      responses:
        "204":
          description: Usuario eliminado correctamente

        "404":
          $ref: "#/components/responses/NotFoundError"
          example:
            error: Usuario no encontrado

        "401":
          $ref: "#/components/responses/UnauthorizedError"

        "403":
          $ref: "#/components/responses/ForbbidenError"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /usuarios:
    get:
      summary: Obtener todos los usuarios
      description: Obtiene un array con todos los usuarios registrados en la base de datos

      responses:
        "200":
          description: Usuarios obtenidos correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Usuario"

        "401":
          $ref: "#/components/responses/UnauthorizedError"

        "403":
          $ref: "#/components/responses/ForbbidenError"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Insertar un nuevo usuario
      description: Inserta un nuevo usuario a la base de datos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioInput"

      responses:
        "201":
          description: Usuario insertado correctamente

        "400":
          $ref: "#/components/responses/ValidationError"

        "401":
          $ref: "#/components/responses/UnauthorizedError"

        "403":
          $ref: "#/components/responses/ForbbidenError"

        "409":
          $ref: "#/components/responses/ConflictError"

        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    Paciente:
      type: object
      required:
        - PacienteId
      properties:
        PacienteId:
          type: integer
        DNI:
          type: string
        Nombre:
          type: string
        Direccion:
          type: string
        CodigoPostal:
          type: string
        Telefono:
          type: string
        Genero:
          type: string
        FechaNacimiento:
          type: string
          format: date
        Correo:
          type: string

    PacienteInput:
      type: object
      required:
        - DNI
        - Nombre
        - Direccion
        - CodigoPostal
        - Telefono
        - Genero
        - FechaNacimiento
        - Correo
      properties:
        DNI:
          type: string
        Nombre:
          type: string
        Direccion:
          type: string
        CodigoPostal:
          type: string
        Telefono:
          type: string
        Genero:
          type: string
        FechaNacimiento:
          type: string
          format: date
        Correo:
          type: string

    Cita:
      type: object
      required:
        - CitaId
      properties:
        CitaId:
          type: integer
        PacienteId:
          type: string
        Fecha:
          type: string
          format: date
        HoraInicio:
          type: string
        HoraFin:
          type: string
        Estado:
          type: string
        Motivo:
          type: string

    CitaInput:
      type: object
      required:
        - PacienteId
        - Fecha
        - HoraInicio
        - HoraFin
        - Estado
        - Motivo
      properties:
        PacienteId:
          type: string
        Fecha:
          type: string
          format: date
        HoraInicio:
          type: string
        HoraFin:
          type: string
        Estado:
          type: string
        Motivo:
          type: string

    Usuario:
      type: object
      required:
        - UsuarioId
      properties:
        UsuarioId:
          type: integer
        Usuario:
          type: string
        Estado:
          type: string
        Rol:
          type: string

    UsuarioInput:
      type: object
      required:
        - Usuario
        - Password
        - Estado
        - Rol
      properties:
        Usuario:
          type: string
        Password:
          type: string
        Estado:
          type: string
        Rol:
          type: string

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Descripcion del error ocurrido
          example: Internal Server Error

  responses:
    UnauthorizedError:
      description: El token JWT falta, es invalido o ha expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Error en el token

    ForbbidenError:
      description: El usuario no tiene autorizacion para ejecutar el endpoint
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Acceso denegado

    NotFoundError:
      description: No se encontro el recurso solicitado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ConflictError:
      description: Ya existe un usuario asociado a la direccion de correo recibida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Un usuario ya existe con esa direccion de correo electronico

    ValidationError:
      description: Se ingreso un dato invalido al crear o actualizar un recurso
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Datos invalidos

    InternalServerError:
      description: Se disparo un error no esperado en el servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Internal Server Error

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
